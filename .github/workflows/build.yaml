name: build not-kernel CI variant r8q

on:
  push:
    branches: [ "CALY-Stable" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    env:
      DEVICE: r8q
      DEVICE_NAME: Galaxy S20 FE
      KERNEL_NAME: not_kernel

    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          ref: CALY-Stable

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "America/Sao_Paulo"

      - name: Setting up the environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu clang lld llvm libssl-dev python3-dev
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download and Setup AOSP Clang
        run: |
          mkdir -p prebuilts/clang/host/linux-x86
          # Using r416183b which is the standard for Snapdragon 865 kernels
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/clang-r416183b prebuilts/clang/host/linux-x86/clang-r416183b
          echo "$(pwd)/prebuilts/clang/host/linux-x86/clang-r416183b/bin" >> $GITHUB_PATH

      - name: Set Build Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run build script
        run: |
          if [ -f "build_kona_kernel.sh" ]; then
            chmod +x build_kona_kernel.sh
            # Sequence: r8q -> No LLVM -> Yes KSU -> Yes Permissive
            printf "r8q\nno\nyes\nyes\n" | ./build_kona_kernel.sh
          else
            echo "Error: build_kona_kernel.sh not found. Listing root directory:"
            ls -F
            exit 1
          fi

      - name: Set Build End Time
        run: echo "END_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate Build Duration
        run: |
          duration=$((END_TIME - START_TIME))
          minutes=$((duration / 60))
          seconds=$((duration % 60))
          echo "BUILD_DURATION=${minutes}m ${seconds}s" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Kernel-r8q
          path: |
            out/*.zip
            *.zip
            out/arch/arm64/boot/Image.gz-dtb
