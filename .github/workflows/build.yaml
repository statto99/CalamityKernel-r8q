name: build not-kernel CI variant r8q

on:
  push:
    branches: [ "CALY-Stable" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          ref: CALY-Stable
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Setting up Environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          libssl-dev python3-dev rsync curl git
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Setup Toolchains (Clang & GAS)
        run: |
          # 1. Create the directories the script expects
          mkdir -p clang/clang-r547379
          mkdir -p gas
          
          # 2. Download the exact Clang r547379 (AOSP)
          # We use a newer AOSP mirror for this specific version
          curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
          tar -C clang/clang-r547379 -xzf clang-r547379.tar.gz
          
          # 3. Setup GAS (Generic AArch64/ARM32 binutils)
          # We link the system ones to the 'gas' folder the script looks for
          ln -s /usr/bin/aarch64-linux-gnu-ld gas/aarch64-linux-gnu-ld
          ln -s /usr/bin/aarch64-linux-gnu-objcopy gas/aarch64-linux-gnu-objcopy
          # Add prefix for the script's specific GAS_CROSS_COMPILE variable
          cp /usr/bin/aarch64-linux-gnu-as gas/aarch64-linux-gnu-as
          cp /usr/bin/aarch64-linux-gnu-ar gas/aarch64-linux-gnu-ar

      - name: Patch Build Script Pathing
        run: |
          # Replace the hardcoded /home/atakan/ paths with the GitHub workspace path
          # This is the critical fix for the 'AOSP toolchain directories not found' error
          sed -i "s|/home/atakan/clang/clang-r547379|$(pwd)/clang/clang-r547379|g" build_kona_kernel.sh
          sed -i "s|/home/atakan/gas|$(pwd)/gas|g" build_kona_kernel.sh
          
          # Optional: Fix warnings as errors if it still fails on drivers
          export KCFLAGS="-Wno-error"

      - name: Run Build Script
        run: |
          chmod +x build_kona_kernel.sh
          # Answer the 4 prompts: r8q, no (SDClang), yes (KSU), yes (Permissive)
          printf "r8q\nno\nyes\nyes\n" | ./build_kona_kernel.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calamity-r8q-Kernel
          path: |
            out/Image
            out/dtb.img
            out/dtbo.img
            build_env/r8q/*.img
