name: build not-kernel CI variant r8q

on:
  push:
    branches: [ "CALY-Stable" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          ref: CALY-Stable
          submodules: recursive

      - name: Free Disk Space
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Setting up Environment
        run: |
          sudo apt-get update -y
          # Added wget and gcc-arm-linux-gnueabi for the 32-bit compat headers
          sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi libssl-dev python3-dev rsync curl git wget
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Setup Toolchains
        run: |
          mkdir -p toolchains/clang-r547379
          mkdir -p toolchains/gas
          
          # 1. Download Clang r547379 using a direct AOSP clone
          # This is the official Google source and does not require a username
          echo "Cloning Clang r547379 from AOSP..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchains/clang-temp
          
          # The repo above contains MANY versions. We move the one we need.
          mv toolchains/clang-temp/clang-r547379/* toolchains/clang-r547379/
          rm -rf toolchains/clang-temp
          
          # 2. Link system tools to the 'gas' folder
          ln -s /usr/bin/aarch64-linux-gnu-as toolchains/gas/aarch64-linux-gnu-as
          ln -s /usr/bin/aarch64-linux-gnu-ld toolchains/gas/aarch64-linux-gnu-ld
          ln -s /usr/bin/aarch64-linux-gnu-objcopy toolchains/gas/aarch64-linux-gnu-objcopy
          ln -s /usr/bin/arm-linux-gnueabi-as toolchains/gas/arm-linux-gnueabi-as
          
          # 3. Verify
          if [ -x "toolchains/clang-r547379/bin/clang" ]; then
            echo "Clang r547379 is ready."
            ./toolchains/clang-r547379/bin/clang --version
          else
            echo "Error: Clang binary not found!"
            exit 1
          fi

      - name: Patch Script Paths
        run: |
          # This swaps the developer's home path for the GitHub path
          sed -i "s|/home/atakan/clang/clang-r547379|$(pwd)/toolchains/clang-r547379|g" build_kona_kernel.sh
          sed -i "s|/home/atakan/gas|$(pwd)/toolchains/gas|g" build_kona_kernel.sh
          # Ensure the magiskboot tool inside your repo is executable for the repack phase
          chmod +x build_env/WORK_DIR/magiskboot-x86 || true

      - name: Run Build Script
        run: |
          # 1. Create short temporary directory & Sync
          sudo mkdir -p /k
          sudo chown -R runner:runner /k
          rsync -aq ./ /k/
          cd /k
          
          # 2. Inject BPFtrace/Debug requirements into defconfig
          # For Kona/S20FE, the base config is usually vendor/kona-sec-perf_defconfig
          DEFCONFIG_PATH="arch/arm64/configs/vendor/kona-sec-perf_defconfig"
          echo "Injecting BPFtrace requirements into $DEFCONFIG_PATH..."
          
          {
            echo "CONFIG_DEBUG_INFO=y"
            echo "CONFIG_DEBUG_INFO_DWARF5=y"
            echo "CONFIG_DEBUG_INFO_BTF=y"
            echo "CONFIG_DEBUG_INFO_NONE=n"
            echo "CONFIG_DEBUG_INFO_REDUCED=n"
            echo "CONFIG_DEBUG_INFO_SPLIT=n"
            echo "CONFIG_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_UPROBES=y"
            echo "CONFIG_UPROBE_EVENTS=y"
            echo "CONFIG_PERF_EVENTS=y"
            echo "CONFIG_FTRACE=y"
            echo "CONFIG_DYNAMIC_FTRACE=y"
            echo "CONFIG_FUNCTION_TRACER=y"
            echo "CONFIG_GENERIC_TRACER=y"
            echo "CONFIG_TRACING=y"
            echo "CONFIG_FUNCTION_ERROR_INJECTION=y"
            echo "CONFIG_BPF_KPROBE_OVERRIDE=y"
            echo "CONFIG_BPF_EVENTS=y"
            echo "CONFIG_KRETPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_HAVE_KRETPROBES=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_MODULES=y"
            echo "CONFIG_MODULE_FORCE_LOAD=y"
            echo "CONFIG_STRICT_MEMORY_RWX=n"
          } >> $DEFCONFIG_PATH

          # 3. Patch the toolchain paths for the new /k location
          # Point them back to the workspace where we downloaded them
          sed -i "s|/home/atakan/clang/clang-r547379|/home/runner/work/CalamityKernel-r8q/CalamityKernel-r8q/toolchains/clang-r547379|g" build_kona_kernel.sh
          sed -i "s|/home/atakan/gas|/home/runner/work/CalamityKernel-r8q/CalamityKernel-r8q/toolchains/gas|g" build_kona_kernel.sh
          
          # 4. Standard build prep
          ulimit -s unlimited
          chmod +x build_kona_kernel.sh
          export KCFLAGS="-Wno-error"
          
          # 5. Run the build (Model r8q | No SDClang | Yes KSU | Yes Permissive)
          printf "r8q\nno\nyes\nyes\n" | ./build_kona_kernel.sh
          
          # 6. Move output back to workspace for Upload
          mkdir -p $GITHUB_WORKSPACE/out
          cp -r /k/out/* $GITHUB_WORKSPACE/out/ || true
          # If the Repack worked, get the images
          cp -r /k/build_env/r8q/*.img $GITHUB_WORKSPACE/out/ || true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calamity-r8q-Kernel
          path: |
            out/Image
            out/dtb.img
            out/dtbo.img
            build_env/r8q/*.img
