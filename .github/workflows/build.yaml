name: build not-kernel CI variant r8q

on:
  push:
    branches: [ "CALY-Stable" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          ref: CALY-Stable
          submodules: recursive
          fetch-depth: 1

      - name: Deep Clean Environment
        run: |
          sudo docker image prune -a -f
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -y
          sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libelf-dev \
          python3-dev rsync curl git wget dwarves
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Setup Toolchains (Reliable Clone)
        run: |
          mkdir -p toolchains/clang-r547379
          mkdir -p toolchains/gas
          echo "Cloning Clang r547379..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchains/temp_clang
          mv toolchains/temp_clang/clang-r547379/* toolchains/clang-r547379/
          rm -rf toolchains/temp_clang
          ln -s /usr/bin/aarch64-linux-gnu-as toolchains/gas/aarch64-linux-gnu-as
          ln -s /usr/bin/aarch64-linux-gnu-ld toolchains/gas/aarch64-linux-gnu-ld
          ln -s /usr/bin/arm-linux-gnueabi-as toolchains/gas/arm-linux-gnueabi-as

      - name: Verify Toolchain
        run: |
          ./toolchains/clang-r547379/bin/clang --version

      - name: Short-Path Build & Defconfig Injection
        run: |
          sudo mkdir -p /k
          sudo chown -R runner:runner /k
          rsync -aq ./ /k/
          cd /k
          DEFCONFIG_PATH="arch/arm64/configs/vendor/kona-sec-perf_defconfig"
          echo "Injecting MANDATORY BPF/DebugFS/Tracing suite into $DEFCONFIG_PATH"
          {
            echo "CONFIG_DEBUG_FS=y"
            echo "CONFIG_DEBUG_KERNEL=y"
            echo "CONFIG_MSM_BUS_SCALING=y"
            echo "CONFIG_MSM_BUS_RPMH=y"
            echo "CONFIG_MSM_BUS_NODBG=y"
            echo "CONFIG_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_HAVE_EBPF_JIT=y"
            echo "CONFIG_BPF_JIT_ALWAYS_ON=y"
            echo "CONFIG_BPF_EVENTS=y"
            echo "CONFIG_CGROUP_BPF=y"
            echo "CONFIG_FTRACE=y"
            echo "CONFIG_FUNCTION_TRACER=y"
            echo "CONFIG_TRACING=y"
            echo "CONFIG_DYNAMIC_FTRACE=y"
            echo "CONFIG_FTRACE_SYSCALLS=y"
            echo "CONFIG_HAVE_SYSCALL_TRACEPOINTS=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_UPROBES=y"
            echo "CONFIG_UPROBE_EVENTS=y"
            echo "CONFIG_RETPROBES=y"
            echo "CONFIG_PROBE_EVENTS=y"
            echo "CONFIG_EVENT_TRACING=y"
            echo "CONFIG_PERF_EVENTS=y"
            echo "CONFIG_HAVE_PERF_EVENTS=y"
            echo "CONFIG_ANON_INODES=y"
            echo "CONFIG_DEBUG_INFO=y"
            echo "CONFIG_DEBUG_INFO_BTF=y"
            echo "CONFIG_DEBUG_INFO_DWARF5=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_IKCONFIG=y"
            echo "CONFIG_IKCONFIG_PROC=y"
            echo "CONFIG_FRAME_POINTER=y"
            echo "CONFIG_STRIP_ASM_SYMS=n"
            echo "CONFIG_STRICT_KERNEL_RWX=n"
            echo "CONFIG_STRICT_MODULE_RWX=n"
            echo "CONFIG_RKP=n"
            echo "CONFIG_KNOX_KAP=n"
            echo "CONFIG_SECURITY_SELINUX_DEVELOP=y"
            echo "CONFIG_SECURITY_PERF_EVENTS_RESTRICT=n"
            echo "CONFIG_KSU=n"
          } >> "$DEFCONFIG_PATH"
          
          WORKSPACE_PATH="/home/runner/work/CalamityKernel-r8q/CalamityKernel-r8q"
          sed -i "s|/home/atakan/clang/clang-r547379|$WORKSPACE_PATH/toolchains/clang-r547379|g" build_kona_kernel.sh
          sed -i "s|/home/atakan/gas|$WORKSPACE_PATH/toolchains/gas|g" build_kona_kernel.sh
          
          ulimit -s unlimited
          chmod +x build_kona_kernel.sh
          export KCFLAGS="-Wno-error"
          
          printf "r8q\nno\nno\nyes\n" | ./build_kona_kernel.sh
          
          mkdir -p $GITHUB_WORKSPACE/out
          cp -r /k/out/* $GITHUB_WORKSPACE/out/ || true
          cp -r /k/build_env/r8q/*.img $GITHUB_WORKSPACE/out/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CalamityKernel-r8q-Flashable
          path: |
            out/*.img
            out/Image
            out/dtb.img
            out/dtbo.img
