name: build not-kernel CI variant r8q

on:
  push:
    branches: [ "CALY-Stable" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    env:
      DEVICE: r8q
      DEVICE_NAME: Galaxy S20 FE
      KERNEL_NAME: not_kernel

    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          ref: CALY-Stable

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "America/Sao_Paulo"

      - name: Setting up the environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu clang lld llvm libssl-dev python3-dev
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download and Setup AOSP Clang
        run: |
          # 1. Create the base directory
          mkdir -p prebuilts/clang/host/linux-x86
          
          # 2. Clone from LineageOS mirror (much more reliable for GitHub Actions)
          # This specifically pulls the r416183b version needed for Snapdragon 865
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b prebuilts/clang/host/linux-x86/clang-r416183b
          
          # 3. Add the bin folder to the system PATH
          echo "$(pwd)/prebuilts/clang/host/linux-x86/clang-r416183b/bin" >> $GITHUB_PATH
          
          # 4. Debug: Verify clang is accessible
          export PATH="$(pwd)/prebuilts/clang/host/linux-x86/clang-r416183b/bin:$PATH"
          clang --version

      - name: Run build script
        run: |
          if [ -f "build_kona_kernel.sh" ]; then
            chmod +x build_kona_kernel.sh
            
            # 1. Fix Hardcoded Toolchain Paths
            TOOLCHAIN_PATH="$(pwd)/prebuilts/clang/host/linux-x86/clang-r416183b"
            sed -i "s|/home/.*/toolchains/.*-clang|$TOOLCHAIN_PATH|g" build_kona_kernel.sh
            sed -i 's/exit 1/echo "Forcing build..."/g' build_kona_kernel.sh

            # 2. Global Compiler Fixes
            # Disable specific warnings that commonly break drivers/staging/android
            export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-format-security"
            export KCPPFLAGS="-Wno-error"
            
            # 3. Handle KernelSU properly
            # If the script downloads KSU, it might need git identity
            git config --global user.email "ci@example.com"
            git config --global user.name "CI"

            # 4. Cleanup 'out' if it exists to prevent 'Error 2' from previous cached failures
            rm -rf out/
            
            # 5. Run the Build
            # Device: r8q | LLVM: no | KSU: yes | Permissive: yes
            printf "r8q\nno\nyes\nyes\n" | ./build_kona_kernel.sh
          else
            echo "Error: build_kona_kernel.sh not found."
            exit 1
          fi

      - name: Set Build End Time
        run: echo "END_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate Build Duration
        run: |
          duration=$((END_TIME - START_TIME))
          minutes=$((duration / 60))
          seconds=$((duration % 60))
          echo "BUILD_DURATION=${minutes}m ${seconds}s" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Kernel-r8q
          path: |
            out/*.zip
            *.zip
            out/arch/arm64/boot/Image.gz-dtb
